name: Controlli

# Questo controllo gira su ogni proposta di modifica e su ogni scrittura in main.
# E' cio' che il percorso rende obbligatorio nella lezione sui controlli automatici.

on:
  pull_request:
  push:
    branches: [main]

# Il test legge solo il codice: il token di GitHub riceve la sola lettura,
# qualunque sia l'impostazione predefinita del repository o dell'organizzazione.
permissions:
  contents: read

jobs:
  test:
    name: Test del calcolo fatture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Esegui i test
        run: node --test
